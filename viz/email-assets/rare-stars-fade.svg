<svg xmlns="http://www.w3.org/2000/svg" width="320" height="224" viewBox="0 0 320 224">
  <!--
    Rare-card star pattern with its diagonal fade BUILT IN, for the email renderer
    (~/spirit-tracker-api src/email_alert.ts). Same 28px tile and stars as rare-stars.svg, at
    full strength (0.28) near the top-left corner and fading out along the diagonal, no-repeat.
    The fade used to be a CSS gradient to #ffffff layered over a repeating tile, but Gmail's
    dark mode inverts solid colours and never gradients, so that white stayed white under
    inverted (light) text. With the fade in the image, nothing opaque sits over the card.
    Opacity per star = 0.28 until x+y = 110px, linear to 0 at x+y = 300px. rare-stars.svg
    stays for emails already sent.
  -->
