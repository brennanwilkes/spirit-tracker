<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!--
    Gold star tile for rare-card email backgrounds. Served from the viz
    static root so Gmail desktop, which strips background-image data: URIs,
    can still load the pattern via https. Tile is 28×28 with two small
    5-pointed stars offset along the diagonal so they fall on diagonal rows
    when tiled. Opacity is kept low (~0.28) so the pattern reads as texture,
    not decoration that competes with the card text.
  -->
  <polygon points="7,3 7.95,5.35 10.45,5.55 8.55,7.15 9.15,9.6 7,8.35 4.85,9.6 5.45,7.15 3.55,5.55 6.05,5.35" fill="#b8860b" fill-opacity="0.28"/>
  <polygon points="21,17 21.95,19.35 24.45,19.55 22.55,21.15 23.15,23.6 21,22.35 18.85,23.6 19.45,21.15 17.55,19.55 20.05,19.35" fill="#b8860b" fill-opacity="0.28"/>
</svg>
