<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!--
    Gold star tile for rare-card email backgrounds. Served from the viz
    static root so Gmail desktop, which strips background-image data: URIs,
    can still load the pattern via https. Tile is 28×28 with two 5-pointed
    stars offset along the diagonal so they fall on diagonal rows when tiled.
  -->
  <polygon points="7,2 8.5,5.5 12.2,5.8 9.4,8.2 10.3,11.8 7,9.9 3.7,11.8 4.6,8.2 1.8,5.8 5.5,5.5" fill="#b8860b" fill-opacity="0.55"/>
  <polygon points="21,16 22.5,19.5 26.2,19.8 23.4,22.2 24.3,25.8 21,23.9 17.7,25.8 18.6,22.2 15.8,19.8 19.5,19.5" fill="#b8860b" fill-opacity="0.55"/>
</svg>
