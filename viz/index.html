<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Read before CSS: tells the browser we render dark ourselves so mobile
         auto-dark-theme doesn't re-invert our UI (white dropdown panels). -->
    <meta name="color-scheme" content="dark light" />
    <title>Brennan's Spirit Tracker</title>
    <!-- Deliberately NO <meta name="theme-color">. Without one, iOS Safari tints the status
         bar from the page's own background, which always matches the in-app theme. A
         media-keyed pair showed the light colour over the dark theme when the OS was light
         and the app was set to dark, and JS updates to it were not picked up. -->

    <!-- PWA. iOS does not reliably take the home-screen icon from the manifest, so the
         legacy apple-* tags stay alongside it. black-translucent puts the page under the
         status bar; style.css paints a scrim there (body::before). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spirit Tracker" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <!-- Filled by tools/stamp_pwa.js at deploy; app/pwa.js registers the worker only when stamped. -->
    <meta name="st-build" content="__BUILD__" />

    <!-- Shared base styles (mobile-first) -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Per-page styles (all loaded upfront; browser handles efficiently) -->
    <link rel="stylesheet" href="./app/search_page/search_page.css" />
    <link rel="stylesheet" href="./app/item_page/item_page.css" />
    <link rel="stylesheet" href="./app/store_page/store_page.css" />
    <link rel="stylesheet" href="./app/stores_page/stores_page.css" />
    <link rel="stylesheet" href="./app/stats_page/stats_page.css" />
    <link rel="stylesheet" href="./app/shortlist_page/shortlist_page.css" />
    <link rel="stylesheet" href="./app/linker_page/linker_page.css" />
    <link rel="stylesheet" href="./app/linker_page/linker_rapid_page.css" />
    <link rel="stylesheet" href="./app/linker_page/link_review_page.css" />
    <link rel="stylesheet" href="./app/auth_page/auth_page.css" />
    <link rel="stylesheet" href="./app/settings_page/settings_page.css" />
    <link rel="stylesheet" href="./app/public_shortlists_page/public_shortlists_page.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Chart.js (no build step). `crossorigin` makes these CORS requests so sw.js can cache
         them for offline use; without it they are opaque and never cached. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" crossorigin="anonymous" />

    <!-- App (ES modules; no bundler required) -->
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
