name: Deploy visualizer to GitHub Pages

on:
  push:
    branches: [data]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1
          lfs: false   # viz/data/* is plain git now; embeddings is a Release asset. No smudge.

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v4

      # viz/data/index.json is a GitHub Release asset (tag index-latest), NOT committed — it was
      # the largest single source of data-branch growth (~85 MiB/mo; HEAD-only, regenerable). Pull
      # it into the site artifact so the SPA keeps fetching ./data/index.json SAME-ORIGIN (zero
      # frontend change). Same cross-origin-CORS constraint as the stats bundles below: a browser
      # cannot fetch a Release asset (the download 302s to release-assets.githubusercontent.com,
      # which sends no access-control-allow-origin), so deploy-time staging is REQUIRED.
      #
      # Unlike the stats step this FAILS LOUDLY instead of warning: every page calls loadIndex(),
      # so a site without index.json is a broken site. Failing the deploy keeps the last good
      # deployment live (deploy-pages only swaps on success).
      - name: Stage index.json into site artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p viz/data
          if gh release download index-latest \
               --repo "$GITHUB_REPOSITORY" \
               --dir viz/data --pattern 'index.json' --clobber; then
            echo "staged index.json ($(wc -c < viz/data/index.json) bytes)"
          else
            echo "ERROR: index-latest asset not found or download failed; aborting deploy (last good deployment stays live)" >&2
            exit 1
          fi

      # viz/data/recent.json is a GitHub Release asset (tag recent-latest), NOT committed — it's
      # HEAD-only (state.js) and wholesale-regenerated each run, so its git history is dead weight
      # (~6.5 MiB/mo). Stage it into the site artifact so the SPA serves ./data/recent.json
      # SAME-ORIGIN. WARN-level (unlike index): loadRecent() has a catch fallback, so a missing
      # asset just empties the activity feed rather than breaking the site.
      - name: Stage recent.json into site artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p viz/data
          if gh release download recent-latest \
               --repo "$GITHUB_REPOSITORY" \
               --dir viz/data --pattern 'recent.json' --clobber; then
            echo "staged recent.json ($(wc -c < viz/data/recent.json) bytes)"
          else
            echo "WARN: recent-latest asset not found; recent activity feed will be empty" >&2
          fi

      # viz/data/skus/** is a GitHub Release asset (tag skus-latest) stored as ONE tar.gz, NOT
      # committed — the per-SKU price-history cache is HEAD-only (fetched per item page) and
      # incremental, so its git history is dead weight (~11.8 MiB/mo). The SPA requests
      # ./data/skus/<sku>.json SAME-ORIGIN, so this step downloads + extracts the tarball into the
      # site artifact. WARN-level: item_page.js catches a missing cache file (chart silently
      # omitted), so a missing asset degrades one page feature, not the whole site.
      - name: Stage per-SKU history cache into site artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p viz/data
          if gh release download skus-latest \
               --repo "$GITHUB_REPOSITORY" \
               --pattern 'skus.tar.gz' --output /tmp/skus.tar.gz --clobber; then
            tar xzf /tmp/skus.tar.gz -C viz/data
            echo "staged skus cache ($(find viz/data/skus -name '*.json' | wc -l) SKU files)"
          else
            echo "WARN: skus-latest asset not found; item pages will render without price history charts" >&2
          fi

      # Make sku_links.json + sku_links_auto.json available to the static site
      # without committing second copies. Both are pulled by viz/app/api.js.
      - name: Stage sku_links*.json into site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viz/data
          if [[ -f data/sku_links.json ]]; then
            cp -f data/sku_links.json viz/data/sku_links.json
          else
            # keep site functional even if file is missing
            echo '{"links":[],"ignores":[]}' > viz/data/sku_links.json
          fi
          if [[ -f data/sku_links_auto.json ]]; then
            cp -f data/sku_links_auto.json viz/data/sku_links_auto.json
          fi
          if [[ -f data/sku_hidden.json ]]; then
            cp -f data/sku_hidden.json viz/data/sku_hidden.json
          else
            cat > viz/data/sku_hidden.json <<'EOF'
          {
            "generatedAt": "",
            "hidden": []
          }
          EOF
          fi

      # The #/stats series bundles are GitHub Release assets, not committed (they'd add ~106 MB/mo
      # of data-branch growth). Pull them into the site artifact so the SPA fetches them
      # SAME-ORIGIN from ./data/stats/.
      #
      # This staging step is REQUIRED, not an optimisation: fetching a Release asset from the
      # browser does not work. github.com/…/releases/download/… 302s to
      # release-assets.githubusercontent.com (Azure Blob), whose response carries NO
      # access-control-allow-origin, so the cross-origin fetch is blocked and stats_page.js
      # silently falls back to its slow per-commit path (~214 requests, 20-30s). Verified with
      # `curl -D -` sending an Origin header: no ACAO on the final response.
      - name: "Stage stats series bundles into site artifact"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p viz/data/stats
          if gh release download stats-series-latest \
               --repo "$GITHUB_REPOSITORY" \
               --dir viz/data/stats --pattern '*.json' --clobber; then
            echo "staged $(ls -1 viz/data/stats | wc -l) stats bundle(s)"
          else
            echo "WARN: no stats bundles on the release tag; #/stats falls back to the slow per-commit path" >&2
          fi

      # One static page per item (viz/i/<sku>/) carrying that listing's Open Graph title +
      # image, so shared item links preview as the bottle, not the site. Needs index.json and
      # the sku_*.json files staged above. Fails the deploy on bad data, like the index step.
      - name: Build item share pages
        run: node tools/build_share_pages.mjs viz "${{ steps.pages.outputs.base_url }}"

      # Fills sw.js's BUILD + precache list and index.html's st-build meta. BUILD hashes the
      # shell files, not the commit, so the ~8 data-only deploys a day leave installed apps'
      # cached shell alone. An unstamped site still works; it just never registers the worker.
      - name: Stamp PWA build
        run: node tools/stamp_pwa.js viz

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viz

      # deploy-pages lists this run's artifacts right after the upload, and that listing is
      # eventually consistent: on 2026-11-24/25 about half the deploys failed, seeing either 0
      # artifacts (run 45676446886: the upload finalized at :19.88, the lookup at :20.35 found
      # nothing, and the lookup in "Diagnose" half a second later found it) or "Artifact count
      # is 3" for a run that uploaded one, with githubstatus green. So wait until the listing
      # shows exactly one, and retry the deploy once if it still fails.
      - name: Wait for artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length') || n="?"
            echo "poll $i: github-pages artifacts listed = $n"
            if [ "$n" = "1" ]; then exit 0; fi
            sleep 2
          done
          echo "::warning::artifact listing never settled on exactly one github-pages artifact; deploying anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::deploy-pages failed on the first attempt; retrying in 30s"
          sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Diagnose failed deploy
        if: failure() && steps.deployment_retry.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT sha=$GITHUB_SHA"
          arts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | "  \(.name) id=\(.id) created=\(.created_at) run=\(.workflow_run.id) expired=\(.expired)"' 2>&1) || true
          echo "artifacts visible to this run:"
          echo "$arts"
          status=$(curl -fsS --max-time 10 https://www.githubstatus.com/api/v2/summary.json \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['status']['description']+' | '+'; '.join(i['name'] for i in d['incidents']))" 2>&1) || status="githubstatus unreachable"
          echo "githubstatus: $status"
          {
            echo "### Pages deploy failed"
            echo "- run \`$GITHUB_RUN_ID\` attempt $GITHUB_RUN_ATTEMPT"
            echo "- githubstatus: $status"
            echo "- artifacts:"
            echo '```'
            echo "$arts"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::deploy-pages failed | githubstatus: $status"
