name: Deploy visualizer to GitHub Pages

on:
  push:
    branches: [data]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1
          lfs: false   # viz/data/* is plain git now; embeddings is a Release asset. No smudge.

      - name: Configure Pages
        uses: actions/configure-pages@v4

      # viz/data/index.json is a GitHub Release asset (tag index-latest), NOT committed — it was
      # the largest single source of data-branch growth (~85 MiB/mo; HEAD-only, regenerable). Pull
      # it into the site artifact so the SPA keeps fetching ./data/index.json SAME-ORIGIN (zero
      # frontend change). Same cross-origin-CORS constraint as the stats bundles below: a browser
      # cannot fetch a Release asset (the download 302s to release-assets.githubusercontent.com,
      # which sends no access-control-allow-origin), so deploy-time staging is REQUIRED.
      #
      # Unlike the stats step this FAILS LOUDLY instead of warning: every page calls loadIndex(),
      # so a site without index.json is a broken site. Failing the deploy keeps the last good
      # deployment live (deploy-pages only swaps on success).
      - name: Stage index.json into site artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p viz/data
          if gh release download index-latest \
               --repo "$GITHUB_REPOSITORY" \
               --dir viz/data --pattern 'index.json' --clobber; then
            echo "staged index.json ($(wc -c < viz/data/index.json) bytes)"
          else
            echo "ERROR: index-latest asset not found or download failed; aborting deploy (last good deployment stays live)" >&2
            exit 1
          fi

      # Make sku_links.json + sku_links_auto.json available to the static site
      # without committing second copies. Both are pulled by viz/app/api.js.
      - name: Stage sku_links*.json into site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viz/data
          if [[ -f data/sku_links.json ]]; then
            cp -f data/sku_links.json viz/data/sku_links.json
          else
            # keep site functional even if file is missing
            echo '{"links":[],"ignores":[]}' > viz/data/sku_links.json
          fi
          if [[ -f data/sku_links_auto.json ]]; then
            cp -f data/sku_links_auto.json viz/data/sku_links_auto.json
          fi
          if [[ -f data/sku_hidden.json ]]; then
            cp -f data/sku_hidden.json viz/data/sku_hidden.json
          else
            cat > viz/data/sku_hidden.json <<'EOF'
          {
            "generatedAt": "",
            "hidden": []
          }
          EOF
          fi

      # The #/stats series bundles are GitHub Release assets, not committed (they'd add ~106 MB/mo
      # of data-branch growth). Pull them into the site artifact so the SPA fetches them
      # SAME-ORIGIN from ./data/stats/.
      #
      # This staging step is REQUIRED, not an optimisation: fetching a Release asset from the
      # browser does not work. github.com/…/releases/download/… 302s to
      # release-assets.githubusercontent.com (Azure Blob), whose response carries NO
      # access-control-allow-origin, so the cross-origin fetch is blocked and stats_page.js
      # silently falls back to its slow per-commit path (~214 requests, 20-30s). Verified with
      # `curl -D -` sending an Origin header: no ACAO on the final response.
      - name: "Stage stats series bundles into site artifact"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p viz/data/stats
          if gh release download stats-series-latest \
               --repo "$GITHUB_REPOSITORY" \
               --dir viz/data/stats --pattern '*.json' --clobber; then
            echo "staged $(ls -1 viz/data/stats | wc -l) stats bundle(s)"
          else
            echo "WARN: no stats bundles on the release tag; #/stats falls back to the slow per-commit path" >&2
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viz

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
