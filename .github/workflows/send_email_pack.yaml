name: Send email pack

on:
  workflow_dispatch:
    inputs:
      data_sha:
        description: "Data commit SHA to build pack from (defaults to tip of data)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: send-email-pack
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch (full history for parent lookup)
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0
          lfs: false   # viz/data/* is plain git now; the pack reads skus/** as plain files. No smudge.

      - name: Checkout requested data SHA (optional)
        if: inputs.data_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ inputs.data_sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # viz/data/skus/** is a GitHub Release asset (tag skus-latest), NOT committed — the pack's
      # flip-flop suppression reads the per-SKU history cache from viz/data/skus/ on disk
      # (build_email_event_pack.js loadSkuHistory). A fresh checkout has none, and without it
      # flip-flop detection silently degrades → more false-positive email events. Restore the
      # tarball from the Release before building. Note this ships the cache from the LATEST run;
      # replaying an OLD data_sha uses a newer-than-commit cache — acceptable (history only
      # accumulates, and the live tip path is exact).
      - name: Restore per-SKU history cache (skus-latest Release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p viz/data
          if gh release download skus-latest \
               --repo "$GITHUB_REPOSITORY" \
               --pattern 'skus.tar.gz' --output /tmp/skus.tar.gz --clobber; then
            tar xzf /tmp/skus.tar.gz -C viz/data
            echo "restored skus cache ($(find viz/data/skus -name '*.json' | wc -l) SKU files)"
          else
            echo "ERROR: skus-latest asset not found; flip-flop suppression would be silently disabled (false-positive email risk)" >&2
            exit 1
          fi

      - name: Build email pack (JSON)
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          node tools/build_email_event_pack.js "$sha" --out pack.json

      - name: Post email pack
        shell: bash
        env:
          EMAIL_PACK_HMAC_SECRET: ${{ secrets.EMAIL_PACK_HMAC_SECRET }}
        run: |
          set -euo pipefail
          ts="$(date +%s)"
          sig="$( (printf "%s" "${ts}."; cat pack.json) | openssl dgst -sha256 -hmac "${EMAIL_PACK_HMAC_SECRET}" -hex | awk '{print $2}' )"

          response="$(curl -sS --fail-with-body -X POST "https://spirit-tracker-api.brennan-a53.workers.dev/email" \
            -H "Content-Type: application/json" \
            -H "X-Spirit-Timestamp: ${ts}" \
            -H "X-Spirit-Signature: v1=${sig}" \
            --data-binary @pack.json)"

          echo "=== Email Dispatch Summary ==="
          echo "$response" | jq -r '"Attempted : \(.email.attempted)  |  Sent: \(.email.sent)  |  Failed: \(.email.failed)"'

          sent_count="$(echo "$response" | jq '.sent | length')"
          if [ "$sent_count" -gt 0 ]; then
            echo ""
            echo "Sent ($sent_count):"
            echo "$response" | jq -r '.sent[] | "  [\(.uuid)]  skus: \(.skus | join(", "))"'
          else
            echo "No emails sent."
          fi

          failed_count="$(echo "$response" | jq '.failures | length')"
          if [ "$failed_count" -gt 0 ]; then
            echo ""
            echo "Failures ($failed_count):"
            echo "$response" | jq -r '.failures[] | "  [\(.uuid)]  error: \(.error)"'
          fi