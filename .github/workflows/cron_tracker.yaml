name: Tracker cron (updates data branch)

on:
  schedule:
    # Times are chosen so the COMMIT (run end) lands ~on the 3-hour marks in
    # Pacific time (00/03/06/09/12/15/18/21 PT). Big runs take ~1h, so they fire
    # an hour earlier than the smalls; smalls finish in ~12 min.
    - cron: "45 5,17 * * *"           # big  → commits ~00:00 / 12:00 PT
    - cron: "45 0,3,9,12,15,21 * * *" # small → commits ~03/06/09/15/18/21 PT
  workflow_dispatch:
    inputs:
      mode:
        description: "auto|big|small"
        type: choice
        required: false
        default: auto
        options: [auto, big, small]
      stores:
        description: "Override STORES (comma-separated). Used for small runs if set."
        type: string
        required: false
      is_retry:
        description: "Internal: set true by the auto-retry to prevent a second retry."
        type: boolean
        required: false
        default: false
      vpn:
        description: "Route this run through the ProtonVPN tunnel. The auto-retry passes the opposite of the failed run's egress."
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # needed to push to data
  actions: write    # needed to workflow_dispatch the deploy workflow

concurrency:
  group: tracker-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false  # viz/data/* is no longer LFS; nothing here needs smudging (run_daily.sh
                      # also exports GIT_LFS_SKIP_SMUDGE=1 for the data-branch worktree it manages)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (for linker embedding re-encode)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The venv's bin/python symlinks the runner image's interpreter, so the EXACT patch version
      # is part of the cache's validity — a 3.12.x bump in a new image dangles the symlink. Salt
      # the key with it so the image roll busts the cache instead of poisoning it.
      - name: Pin venv cache to the exact interpreter
        shell: bash
        run: python -VV > tools/linker_ml/.python-build-id

      # Cache the whole venv (CPU torch + sentence-transformers + sklearn). Cold ~1-2 min; warm
      # restore ~seconds. Key includes a torch-version salt so bumping it busts the cache.
      - name: Cache linker_ml venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: tools/linker_ml/.venv
          key: linker-venv-${{ runner.os }}-torch2.12-${{ hashFiles('tools/linker_ml/.python-build-id', 'tools/linker_ml/requirements.txt') }}

      # A restored venv can be DEAD even on a cache hit: venv/bin/python is a symlink into the
      # runner image's interpreter, so a Python patch-version bump in a new image dangles it and
      # every later run silently skips the re-encode. That is exactly what happened between
      # 2026-08-20 and 2026-09-19 — the embeddings-latest Release asset froze for a month while
      # every job still reported success. Prove the venv actually imports before trusting it.
      - name: Validate restored venv
        id: venv-check
        shell: bash
        run: |
          set -uo pipefail
          if tools/linker_ml/.venv/bin/python -c 'import torch, sentence_transformers' 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::cached linker_ml venv is unusable; rebuilding from scratch"
            rm -rf tools/linker_ml/.venv
          fi

      - name: Create venv + install deps (on cache miss or dead venv)
        if: steps.venv-check.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv tools/linker_ml/.venv
          tools/linker_ml/.venv/bin/python -m pip install --upgrade pip
          tools/linker_ml/.venv/bin/pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          tools/linker_ml/.venv/bin/pip install -r tools/linker_ml/requirements.txt

      # The ~90 MB fine-tuned encoder checkpoint is NOT in git/LFS (the cron never smudges data-branch
      # LFS, so an LFS checkpoint would arrive as a useless pointer; and a release asset costs no LFS
      # bandwidth/storage). It's a GitHub Release asset; we cache it keyed on tools/linker_ml/MODEL_VERSION
      # (bumped on every hand-retrain), so it's downloaded only when the model actually changes.
      - name: Restore encoder checkpoint (cache)
        id: ckpt-cache
        uses: actions/cache@v4
        with:
          path: tools/linker_ml/model_ft
          key: linker-model-ft-${{ hashFiles('tools/linker_ml/MODEL_VERSION') }}

      - name: Download encoder checkpoint from Release (on cache miss only)
        if: steps.ckpt-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Tolerant: if the release/asset is missing, leave model_ft empty and let run_daily.sh's
        # encode step skip gracefully (it guards on a populated checkpoint dir). Never fails the cron.
        run: |
          set -uo pipefail
          tag="model-ft-$(cat tools/linker_ml/MODEL_VERSION)"
          rm -rf tools/linker_ml/model_ft
          if gh release download "$tag" --pattern 'model_ft.tar.gz' --output /tmp/model_ft.tar.gz; then
            mkdir -p tools/linker_ml/model_ft
            tar xzf /tmp/model_ft.tar.gz -C tools/linker_ml/model_ft
            echo "checkpoint restored ($(du -sh tools/linker_ml/model_ft | cut -f1))"
          else
            echo "WARN: could not download release '$tag'; embedding re-encode will be skipped this run" >&2
          fi

      - name: Configure git author (for commits made by scripts/run_daily.sh)
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure local data branch exists (required by scripts/run_daily.sh)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/data:refs/remotes/origin/data"
          git branch -f data origin/data

      - name: Decide big vs small (matches your local cron)
        id: plan
        shell: bash
        env:
          CRON_BIG: "45 5,17 * * *"
          CRON_SMALL: "45 0,3,9,12,15,21 * * *"
          STORES_SMALL_DEFAULT: "sierra_springs,craft_cellars,colordevino,liquorama,zyn,highlander"
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_STORES: ${{ inputs.stores }}
          INPUT_VPN: ${{ inputs.vpn }}
          FIRED_SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          mode="${INPUT_MODE:-auto}"
          stores="${INPUT_STORES:-}"
          vpn="${INPUT_VPN:-false}"

          if [[ "$mode" == "auto" || -z "$mode" ]]; then
            if [[ "$EVENT_NAME" == "schedule" && "$FIRED_SCHEDULE" == "$CRON_SMALL" ]]; then
              mode="small"
            else
              mode="big"
            fi
          fi

          if [[ -z "$stores" && "$mode" == "small" ]]; then
            stores="$STORES_SMALL_DEFAULT"
          fi

          # Scheduled smalls carry the Cloudflare-blocked stores (highlander, colordevino), so
          # they start on the VPN; scheduled bigs start direct. The retry flips whichever was used.
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            [[ "$mode" == "small" ]] && vpn=true || vpn=false
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "stores=$stores" >> "$GITHUB_OUTPUT"
          echo "vpn=$vpn" >> "$GITHUB_OUTPUT"

      - name: Capture data SHA before
        id: before
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          echo "sha=$(git rev-parse origin/data)" >> "$GITHUB_OUTPUT"

      # ProtonVPN WireGuard tunnel for runs whose plan says vpn=true. Routes ALL egress through
      # Proton so Cloudflare-fronted stores (highlander, colordevino, gull, sherbrooke, …) stop
      # being challenged on the runner's Azure IP. Best-effort: on any failure the run proceeds
      # direct and the retry flips egress. Re-enabled 2026-10-05: the 2026-07 "handshake never
      # completes" note was wrong (every July run that got wg installed handshook in 1-2 s and
      # scraped fine through the tunnel).
      - name: Connect ProtonVPN WireGuard tunnel
        id: wg
        if: steps.plan.outputs.vpn == 'true'
        shell: bash
        env:
          WG_CONF: ${{ secrets.PROTONVPN_WG_CONF }}
          PROBE_URL: "https://highlanderwine.com/wp-json/wc/store/v1/products?category=200&per_page=3"
        run: bash scripts/vpn_up.sh

      - name: Run your existing cron script (writes + pushes to data)
        id: daily
        shell: bash
        env:
          MAIN_BRANCH: main
          DATA_BRANCH: data
          STORES: ${{ steps.plan.outputs.stores }}
          # big vs small — drives common_listings report commit gating (big only) in run_daily.sh.
          MODE: ${{ steps.plan.outputs.mode }}
          # Point encode.py at the Release-asset checkpoint restored above (absolute path).
          LINKER_MODEL_DIR: ${{ github.workspace }}/tools/linker_ml/model_ft
          # Lets run_daily.sh upload the freshly-encoded sku_embeddings.json to the
          # 'embeddings-latest' Release asset (gh CLI). contents:write (above) authorizes it.
          GH_TOKEN: ${{ github.token }}
          # VPN diagnostics file from the tunnel step — run_daily.sh includes it in the commit message.
          VPN_DIAG_FILE: ${{ steps.wg.outputs.vpn_diag_file }}
        run: |
          set -euo pipefail
          bash scripts/run_daily.sh

      - name: Detect whether data changed
        id: changed
        shell: bash
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          after="$(git rev-parse origin/data)"
          if [[ "$after" != "$BEFORE" ]]; then
            echo "data_changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy + email pack workflows
        if: steps.changed.outputs.data_changed == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # after SHA on origin/data
          git fetch --no-tags origin data
          after="$(git rev-parse origin/data)"

          gh workflow run "Deploy visualizer to GitHub Pages" --ref main
          gh workflow run "Send email pack" --ref main -f data_sha="$after"

      # One-shot retry: if any stores failed (usually Cloudflare challenging this run's egress IP
      # — see CLAUDE.md §"Datacenter-IP Blocking"), re-dispatch THIS workflow for just those
      # stores on a fresh runner with the OPPOSITE egress (direct <-> VPN). Guarded by is_retry
      # so the retry can never spawn another retry, and gated on a non-empty failed list.
      # Concurrency (group: tracker-cron, cancel-in-progress: false) makes the new run queue
      # until this one fully completes.
      - name: Retry failed stores once with the other egress
        if: ${{ github.event.inputs.is_retry != 'true' && steps.daily.outputs.failed_stores != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_STORES: ${{ steps.daily.outputs.failed_stores }}
          RETRY_VPN: ${{ steps.plan.outputs.vpn == 'true' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          echo "Retrying failed stores (vpn=${RETRY_VPN}): ${FAILED_STORES}"
          gh workflow run "Tracker cron (updates data branch)" --ref main \
            -f mode=big -f is_retry=true -f vpn="${RETRY_VPN}" -f stores="${FAILED_STORES}"
