name: Tracker cron (updates data branch)

on:
  schedule:
    # Times are chosen so the COMMIT (run end) lands ~on the 3-hour marks in
    # Pacific time (00/03/06/09/12/15/18/21 PT). Big runs take ~1h, so they fire
    # an hour earlier than the smalls; smalls finish in ~12 min.
    - cron: "45 5,17 * * *"           # big  → commits ~00:00 / 12:00 PT
    - cron: "45 0,3,9,12,15,21 * * *" # small → commits ~03/06/09/15/18/21 PT
  workflow_dispatch:
    inputs:
      mode:
        description: "auto|big|small"
        type: choice
        required: false
        default: auto
        options: [auto, big, small]
      stores:
        description: "Override STORES (comma-separated). Used for small runs if set."
        type: string
        required: false
      is_retry:
        description: "Internal: set true by the auto-retry to prevent a second retry."
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # needed to push to data
  actions: write    # needed to workflow_dispatch the deploy workflow

concurrency:
  group: tracker-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false  # viz/data/* is no longer LFS; nothing here needs smudging (run_daily.sh
                      # also exports GIT_LFS_SKIP_SMUDGE=1 for the data-branch worktree it manages)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (for linker embedding re-encode)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache the whole venv (CPU torch + sentence-transformers + sklearn). Cold ~1-2 min; warm
      # restore ~seconds. Key includes a torch-version salt so bumping it busts the cache.
      - name: Cache linker_ml venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: tools/linker_ml/.venv
          key: linker-venv-${{ runner.os }}-py312-torch2.12-${{ hashFiles('tools/linker_ml/requirements.txt') }}

      - name: Create venv + install deps (on cache miss)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv tools/linker_ml/.venv
          tools/linker_ml/.venv/bin/python -m pip install --upgrade pip
          tools/linker_ml/.venv/bin/pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          tools/linker_ml/.venv/bin/pip install -r tools/linker_ml/requirements.txt

      # The ~90 MB fine-tuned encoder checkpoint is NOT in git/LFS (the cron never smudges data-branch
      # LFS, so an LFS checkpoint would arrive as a useless pointer; and a release asset costs no LFS
      # bandwidth/storage). It's a GitHub Release asset; we cache it keyed on tools/linker_ml/MODEL_VERSION
      # (bumped on every hand-retrain), so it's downloaded only when the model actually changes.
      - name: Restore encoder checkpoint (cache)
        id: ckpt-cache
        uses: actions/cache@v4
        with:
          path: tools/linker_ml/model_ft
          key: linker-model-ft-${{ hashFiles('tools/linker_ml/MODEL_VERSION') }}

      - name: Download encoder checkpoint from Release (on cache miss only)
        if: steps.ckpt-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Tolerant: if the release/asset is missing, leave model_ft empty and let run_daily.sh's
        # encode step skip gracefully (it guards on a populated checkpoint dir). Never fails the cron.
        run: |
          set -uo pipefail
          tag="model-ft-$(cat tools/linker_ml/MODEL_VERSION)"
          rm -rf tools/linker_ml/model_ft
          if gh release download "$tag" --pattern 'model_ft.tar.gz' --output /tmp/model_ft.tar.gz; then
            mkdir -p tools/linker_ml/model_ft
            tar xzf /tmp/model_ft.tar.gz -C tools/linker_ml/model_ft
            echo "checkpoint restored ($(du -sh tools/linker_ml/model_ft | cut -f1))"
          else
            echo "WARN: could not download release '$tag'; embedding re-encode will be skipped this run" >&2
          fi

      - name: Configure git author (for commits made by scripts/run_daily.sh)
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure local data branch exists (required by scripts/run_daily.sh)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/data:refs/remotes/origin/data"
          git branch -f data origin/data

      - name: Decide big vs small (matches your local cron)
        id: plan
        shell: bash
        env:
          CRON_BIG: "45 5,17 * * *"
          CRON_SMALL: "45 0,3,9,12,15,21 * * *"
          STORES_SMALL_DEFAULT: "sierra_springs,craft_cellars,colordevino,liquorama"
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_STORES: ${{ inputs.stores }}
          FIRED_SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          mode="${INPUT_MODE:-auto}"
          stores="${INPUT_STORES:-}"

          if [[ "$mode" == "auto" || -z "$mode" ]]; then
            if [[ "$EVENT_NAME" == "schedule" && "$FIRED_SCHEDULE" == "$CRON_SMALL" ]]; then
              mode="small"
            else
              mode="big"
            fi
          fi

          if [[ -z "$stores" && "$mode" == "small" ]]; then
            stores="$STORES_SMALL_DEFAULT"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "stores=$stores" >> "$GITHUB_OUTPUT"

      - name: Capture data SHA before
        id: before
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          echo "sha=$(git rev-parse origin/data)" >> "$GITHUB_OUTPUT"

      # ProtonVPN WireGuard tunnel — routes ALL runner traffic through a clean
      # residential-class egress IP so Cloudflare-fronted stores (liberty, highlander,
      # coop, colordevino, maltsandgrains) stop getting blocked by the runner's Azure
      # datacenter IP. Best-effort: if WireGuard isn't available, the config is missing,
      # or the tunnel fails the diagnostic check (egress IP unchanged / store still
      # challenged), the tunnel is torn down and the run proceeds without it. Detailed
      # VPN diagnostics are written to a temp file and included in the commit message.
      #
      # Uses a MANUAL bring-up (wg setconf + ip/route/nft) instead of wg-quick to avoid
      # the two things that intermittently hang on GH runners: apt-get (wg-quick install)
      # and resolvconf (wg-quick DNS setup). The manual path was proven reliable in the
      # VPN diagnostic workflow (vpn_diag.yaml step 6).
      - name: Connect ProtonVPN WireGuard tunnel
        id: wg
        continue-on-error: true
        shell: bash
        env:
          WG_CONF: ${{ secrets.PROTONVPN_WG_CONF }}
          TEST_URL: "https://www.libertywinemerchants.com/wp-json/wc/store/v1/products?per_page=3&category=1075&stock_status=instock"
        run: |
          set +e

          VPN_DIAG="$(mktemp)"
          echo "vpn_diag_file=$VPN_DIAG" >> "$GITHUB_OUTPUT"

          append_diag() { echo "$1" | tee -a "$VPN_DIAG"; }

          if [[ -z "$WG_CONF" ]]; then
            echo "::warning::PROTONVPN_WG_CONF secret not set; skipping VPN"
            append_diag "vpn: off (secret not set)"
            exit 0
          fi

          if ! command -v wg >/dev/null 2>&1; then
            echo "::group::Install wireguard"
            # apt on GH runners is intermittently slow/flaky. DEBIAN_FRONTEND prevents
            # interactive prompts (tzdata etc) from hanging; timeout + clean bail on failure.
            export DEBIAN_FRONTEND=noninteractive
            sudo timeout 120 apt-get update -qq 2>&1 | tail -1
            sudo timeout 120 apt-get install -y -qq wireguard wireguard-tools 2>&1 | tail -3
            install_rc=$?
            echo "::endgroup::"
            if [[ $install_rc -ne 0 ]] || ! command -v wg >/dev/null 2>&1; then
              append_diag "vpn: off (wireguard install failed, rc=$install_rc)"
              exit 0
            fi
            append_diag "vpn: wireguard installed (rc=0)"
          fi

          set -uo pipefail
          append_diag "vpn: starting (manual bring-up)"

          # Write config and extract the tunnel address.
          echo "$WG_CONF" > /tmp/wg0.conf

          # Strip wg-quick-only directives (Address/DNS/Table/PostUp/…); `wg setconf`
          # only understands the crypto/peer fields.
          awk '
            /^\[/ {sect=$0}
            /^(Address|DNS|MTU|Table|PreUp|PostUp|PreDown|PostDown|SaveConfig)\s*=/ {next}
            {print}
          ' /tmp/wg0.conf > /tmp/wg0.setconf.conf

          ADDR="$(grep -i '^Address' /tmp/wg0.conf | head -1 | sed 's/^[^=]*=[[:space:]]*//' | cut -d, -f1)"

          # --- Bring up tunnel manually ---
          sudo timeout 15 ip link add dev wg0 type wireguard 2>&1
          sudo timeout 15 wg setconf wg0 /tmp/wg0.setconf.conf 2>&1
          rc=$?
          if [[ $rc -ne 0 ]]; then
            append_diag "vpn: off (wg setconf failed, rc=$rc)"
            sudo ip link del wg0 2>/dev/null || true
            exit 0
          fi
          [[ -n "$ADDR" ]] && sudo timeout 15 ip address add "$ADDR" dev wg0 2>&1
          sudo timeout 15 ip link set up dev wg0 2>&1

          # Wait for handshake (up to 15s).
          echo "::group::Waiting for handshake"
          HANDSHAKE_OK=false
          for i in $(seq 1 15); do
            hs="$(sudo wg show wg0 latest-handshakes 2>/dev/null | awk '{print $2}')"
            if [[ -n "$hs" && "$hs" != "0" ]]; then
              echo "handshake at t=${i}s"
              HANDSHAKE_OK=true
              break
            fi
            sleep 1
          done
          echo "::endgroup::"

          if [[ "$HANDSHAKE_OK" != "true" ]]; then
            append_diag "vpn: off (no handshake within 15s)"
            sudo ip link del wg0 2>/dev/null || true
            exit 0
          fi

          # --- Add routes (what wg-quick would have done) ---
          # Policy routing via fwmark so only tunnel-routed traffic goes through wg0.
          sudo wg set wg0 fwmark 51820
          sudo ip -4 rule add not fwmark 51820 table 51820
          sudo ip -4 rule add table main suppress_prefixlength 0
          sudo ip -4 route add 0.0.0.0/0 dev wg0 table 51820

          # Set DNS manually (no resolvconf).
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf > /dev/null
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf > /dev/null

          # --- Egress IP check ---
          echo "::group::VPN diagnostic"
          EGRESS_IP="$(timeout 12 curl -fsS --max-time 8 https://api.ipify.org 2>/dev/null || echo "")"
          echo "Egress IP: ${EGRESS_IP:-UNREACHABLE}"

          if [[ -z "$EGRESS_IP" ]]; then
            append_diag "vpn: off (egress IP unreachable through tunnel)"
            sudo ip link del wg0 2>/dev/null || true
            exit 0
          fi

          # --- Store API check ---
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0 Safari/537.36"
          API_OUT="$(timeout 20 curl -sS --max-time 15 -w '\n__CODE__%{http_code}' -H "user-agent: $UA" "$TEST_URL" 2>/dev/null || echo $'\n__CODE__ERR')"
          API_CODE="${API_OUT##*$'\n'__CODE__}"
          API_BODY="${API_OUT%$'\n'__CODE__*}"
          API_BYTES="$(printf '%s' "$API_BODY" | wc -c | tr -d ' ')"

          if printf '%s' "$API_BODY" | head -c 2 | grep -q '\['; then
            append_diag "vpn: ok (egress $EGRESS_IP, store API HTTP $API_CODE ${API_BYTES}B JSON)"
            echo "vpn_ok=true" >> "$GITHUB_OUTPUT"
            echo "vpn_egress_ip=$EGRESS_IP" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$API_BODY" | grep -qiE 'just a moment|challenge-platform|cf-mitigated|attention required'; then
            append_diag "vpn: off (egress $EGRESS_IP, store CF-challenged, HTTP $API_CODE ${API_BYTES}B)"
            sudo ip link del wg0 2>/dev/null || true
          else
            append_diag "vpn: off (egress $EGRESS_IP, store API not JSON, HTTP $API_CODE ${API_BYTES}B)"
            sudo ip link del wg0 2>/dev/null || true
          fi
          echo "::endgroup::"

          # --- Final summary (always visible in step output) ---
          VPN_RESULT="$(tail -1 "$VPN_DIAG")"
          echo
          echo "========================================"
          echo "  VPN: ${VPN_RESULT#vpn: }"
          echo "========================================"

      - name: Run your existing cron script (writes + pushes to data)
        id: daily
        shell: bash
        env:
          MAIN_BRANCH: main
          DATA_BRANCH: data
          STORES: ${{ steps.plan.outputs.stores }}
          # Point encode.py at the Release-asset checkpoint restored above (absolute path).
          LINKER_MODEL_DIR: ${{ github.workspace }}/tools/linker_ml/model_ft
          # Lets run_daily.sh upload the freshly-encoded sku_embeddings.json to the
          # 'embeddings-latest' Release asset (gh CLI). contents:write (above) authorizes it.
          GH_TOKEN: ${{ github.token }}
          # VPN diagnostics file from the tunnel step — run_daily.sh includes it in the commit message.
          VPN_DIAG_FILE: ${{ steps.wg.outputs.vpn_diag_file }}
        run: |
          set -euo pipefail
          bash scripts/run_daily.sh

      - name: Detect whether data changed
        id: changed
        shell: bash
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          after="$(git rev-parse origin/data)"
          if [[ "$after" != "$BEFORE" ]]; then
            echo "data_changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy + email pack workflows
        if: steps.changed.outputs.data_changed == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # after SHA on origin/data
          git fetch --no-tags origin data
          after="$(git rev-parse origin/data)"

          gh workflow run "Deploy visualizer to GitHub Pages" --ref main
          gh workflow run "Send email pack" --ref main -f data_sha="$after"

      # One-shot retry: if any stores failed (usually a bad random Azure egress IP
      # — see CLAUDE.md §"Datacenter-IP Blocking"), re-dispatch THIS workflow for
      # just those stores on a fresh runner (new IP). Guarded by is_retry so the
      # retry can never spawn another retry, and gated on a non-empty failed list.
      # Concurrency (group: tracker-cron, cancel-in-progress: false) makes the new
      # run queue until this one fully completes.
      - name: Retry failed stores once on a fresh runner
        if: ${{ github.event.inputs.is_retry != 'true' && steps.daily.outputs.failed_stores != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_STORES: ${{ steps.daily.outputs.failed_stores }}
        run: |
          set -euo pipefail
          echo "Retrying failed stores on a fresh runner: ${FAILED_STORES}"
          gh workflow run "Tracker cron (updates data branch)" --ref main \
            -f mode=big -f is_retry=true -f stores="${FAILED_STORES}"